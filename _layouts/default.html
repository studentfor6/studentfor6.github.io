<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: site.title }}</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Your existing stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Site metadata -->
  {{ site.head }}
</head>

<body class="bg-gray-50 text-gray-900">

  <!-- Main content -->
  <main class="max-w-6xl mx-auto px-6">
    {{ content }}
    <h2>Comments</h2>
      <iframe 
          src="https://manmeetkap-lxybc.wordpress.com/wp-admin/post.php?post=7&action=edit"
          style="width:100%; height:600px; border:none; overflow:auto;"
          loading="lazy">
      </iframe>

  </main>

  <!-- Footer -->
  <footer class="max-w-6xl mx-auto px-6 py-10 text-sm text-gray-600">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
  </footer>
<hr>




</body>
</html>
